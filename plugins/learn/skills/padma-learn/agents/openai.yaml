interface:
  display_name: "PADMA Learn"
  short_description: "Administrar cursos, módulos, reservas y precios en Learn"
  default_prompt: "Usá $padma-learn para administrar mi escuela autorizada en Learn, organizar módulos y contenido de cursos, configurar precios de reservas de invitados o consultar reportes de asistencia."

dependencies:
  tools:
    - type: "mcp"
      value: "learn"
      description: "Servidor MCP de administración docente de Learn"
      transport: "streamable_http"
      url: "https://learn.derose.app/mcp"
