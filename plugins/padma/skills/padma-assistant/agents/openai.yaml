interface:
  display_name: "PADMA Assistant"
  short_description: "Analizar contactos y escuelas con datos de PADMA"
  default_prompt: "Usá $padma-assistant para preparar la ficha integral de un contacto con su historial y tareas pendientes en CRM, accesos y suscripciones con sus cambios programados en Learn, y planes, movimientos y meses impagos en Money."

dependencies:
  tools:
    - type: "mcp"
      value: "crm"
      description: "Servidor MCP remoto de PADMA CRM"
      transport: "streamable_http"
      url: "https://crm.derose.app/mcp"
    - type: "mcp"
      value: "money"
      description: "Servidor MCP remoto de PADMA Money"
      transport: "streamable_http"
      url: "https://money.derose.app/mcp"
    - type: "mcp"
      value: "learn"
      description: "Servidor MCP de administración docente de Learn"
      transport: "streamable_http"
      url: "https://learn.derose.app/mcp"
