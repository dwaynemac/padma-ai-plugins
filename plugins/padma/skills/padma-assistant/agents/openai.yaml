interface:
  display_name: "PADMA Assistant"
  short_description: "Coordinar CRM, Money y Learn por alumno"
  default_prompt: "Usá $padma-assistant para relacionar un alumno de Learn con su contacto CRM y su situación financiera en Money, verificando identificadores y organizaciones mediante los MCP de cada producto."

dependencies:
  tools:
    - type: "mcp"
      value: "crm"
      description: "Servidor MCP remoto de PADMA CRM"
      transport: "streamable_http"
      url: "https://crm.derose.app/mcp"
    - type: "mcp"
      value: "money"
      description: "Servidor MCP remoto de PADMA Money"
      transport: "streamable_http"
      url: "https://money.derose.app/mcp"
    - type: "mcp"
      value: "learn"
      description: "Servidor MCP de administración docente de Learn"
      transport: "streamable_http"
      url: "https://learn.derose.app/mcp"
